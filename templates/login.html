<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · TeleBot Builder</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('tb-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--border:#e4e7ec;--border-2:#d0d5dd;--text:#101828;--text-2:#344054;--muted:#667085;--faint:#98a2b3;
 --accent:#155eef;--accent-hover:#004eeb;--ring:rgba(21,94,239,.2);--bad:#b42318;--bad-bg:#fef3f2;--bad-bd:#fecdca;
 --shadow:0 1px 2px rgba(16,24,40,.05);--shadow-lg:0 12px 32px -12px rgba(16,24,40,.14)}
[data-theme=dark]{--bg:#0b0d10;--surface:#121418;--border:#22262d;--border-2:#343a44;--text:#f2f4f7;--text-2:#d0d5dd;--muted:#98a2b3;--faint:#667085;
 --accent:#3b7cff;--accent-hover:#5a91ff;--ring:rgba(59,124,255,.32);--bad:#f97066;--bad-bg:rgba(249,112,102,.1);--bad-bd:rgba(249,112,102,.3);
 --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
 font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;margin-bottom:22px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:var(--shadow-lg)}
h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0}
.sub{color:var(--muted);margin:4px 0 22px}
label{display:block;font-size:13px;font-weight:500;color:var(--text-2);margin:0 0 6px}
.field{margin-bottom:16px}
input{width:100%;height:38px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border-2);border-radius:8px;padding:8px 11px;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
input::placeholder{color:var(--faint)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring);border-color:var(--accent)}
button{width:100%;height:38px;margin-top:6px;font:inherit;font-weight:500;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:8px;cursor:pointer;box-shadow:var(--shadow);transition:background .12s}
button:hover{background:var(--accent-hover)}
button:disabled{opacity:.6;cursor:default}
.err{display:none;margin-bottom:16px;padding:10px 12px;border:1px solid var(--bad-bd);border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.switch{margin-top:18px;text-align:center;color:var(--muted);font-size:13.5px}
.switch a{color:var(--accent);font-weight:500;cursor:pointer;text-decoration:none;border-radius:4px}
.switch a:hover{text-decoration:underline}
@media(max-width:640px){input{font-size:16px}.box{padding:22px}}
</style></head><body>
<div class="brand"><span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"/></svg></span>TeleBot Builder</div>
<form class="box" id="form" novalidate>
 <h1 id="title">Entrar na sua conta</h1>
 <p class="sub" id="sub">Gerencie seus bots do Telegram.</p>
 <div class="err" id="err" role="alert"></div>
 <div id="creds">
  <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required></div>
  <div class="field"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" placeholder="Sua senha" required></div>
 </div>
 <div id="codebox" style="display:none">
  <div class="field"><label for="code" id="codelabel">Código</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="000000"></div>
 </div>
 <button type="submit" id="btn">Entrar</button>
 <div class="switch" id="switchLine">Não tem conta? <a href="#" onclick="toggle();return false">Criar conta</a></div>
</form>
<script>
const $=id=>document.getElementById(id);
let mode='login';   // 'login' ou 'signup'
let step='creds';   // 'creds' (e-mail e senha), '2fa' (código do aplicativo) ou 'mail' (código enviado por e-mail)
function paint(){
 const login = mode==='login', code = step!=='creds';
 $('creds').style.display = code ? 'none' : '';
 $('codebox').style.display = code ? '' : 'none';
 $('err').style.display='none';
 if(step==='2fa'){
  $('title').textContent='Verificação em duas etapas';
  $('sub').textContent='Digite o código de 6 dígitos do aplicativo no seu celular, ou um código reserva.';
  $('codelabel').textContent='Código'; $('btn').textContent='Confirmar';
 }else if(step==='mail'){
  $('title').textContent='Confirme seu e-mail';
  $('sub').textContent='Enviamos um código de 6 dígitos para '+$('email').value.trim()+'. Ele vale por 10 minutos.';
  $('codelabel').textContent='Código recebido'; $('btn').textContent='Confirmar e criar conta';
 }else{
  $('title').textContent = login ? 'Entrar na sua conta' : 'Criar sua conta';
  $('sub').textContent = login ? 'Gerencie seus bots do Telegram.' : 'Use uma senha com pelo menos 8 caracteres, letras e números.';
  $('btn').textContent = login ? 'Entrar' : 'Criar conta';
  $('pw').autocomplete = login ? 'current-password' : 'new-password';
 }
 $('switchLine').innerHTML = code ? '<a href="#" onclick="back();return false">Voltar</a>'
  : login ? 'Não tem conta? <a href="#" onclick="toggle();return false">Criar conta</a>'
  : 'Já tem conta? <a href="#" onclick="toggle();return false">Entrar</a>';
 if(code){$('code').value='';$('code').focus()}
}
function toggle(){mode = mode==='login' ? 'signup' : 'login'; step='creds'; paint()}
function back(){step='creds'; paint()}
function fail(msg){const e=$('err');e.textContent=msg;e.style.display='block'}
// X-Requested-With: o servidor só aceita requisições que vêm desta página (proteção contra CSRF)
const post=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:JSON.stringify(body)}).then(r=>r.json());
$('form').addEventListener('submit', async ev=>{
 ev.preventDefault();
 const email=$('email').value.trim(), pw=$('pw').value, code=$('code').value.trim(), btn=$('btn');
 $('err').style.display='none';
 if(step==='creds'&&(!email||!pw)){fail('Preencha o e-mail e a senha.');return}
 if(step!=='creds'&&!code){fail('Digite o código.');return}
 const label=btn.textContent; btn.disabled=true; btn.textContent='Aguarde...';
 try{
  const j = step==='2fa' ? await post('/api/login/2fa',{code})
   : step==='mail' ? await post('/api/signup/verify',{email,code})
   : await post(mode==='login' ? '/api/login' : '/api/signup',{email,password:pw});
  btn.disabled=false; btn.textContent=label;
  if(j.need_2fa){step='2fa';paint();return}
  if(j.need_code){step='mail';paint();return}
  if(j.ok){window.location.href='/';return}
  fail(j.err||'Não foi possível continuar. Tente de novo.');
 }catch(e){btn.disabled=false; btn.textContent=label; fail('Sem conexão com o servidor. Tente de novo.')}
});
</script>
</body></html>
