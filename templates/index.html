<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeleBot Builder</title>
<style>
:root{
 --bg:#0A0E14;--card:#121821;--card2:#1A212C;--line:#232C3A;
 --txt:#EAF0F7;--mut:#8B98AC;--acc:#2FBF9F;--acc-ink:#06120F;--ok:#2FBF9F;--bad:#E5546B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#1c8f76);display:flex;align-items:center;justify-content:center;font-size:13px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 6px;font-weight:600}
button{background:var(--acc);color:var(--acc-ink);border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.ghost:hover{background:var(--card2)}
button.danger{background:transparent;border:1px solid rgba(229,84,107,.4);color:var(--bad)}
button.danger:hover{background:rgba(229,84,107,.08)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 55px)}
aside{background:var(--card);border-right:1px solid var(--line);padding:14px;overflow-y:auto}
.content{padding:22px;max-width:960px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:13.5px}
input::placeholder,textarea::placeholder{color:#57677C}
input[type=checkbox]{width:auto}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}.row>button{flex:0 0 auto}
.tag{display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;margin:3px 4px 3px 0;font-size:12.5px;cursor:pointer;color:var(--mut)}
.tag:hover{color:var(--bad);border-color:rgba(229,84,107,.4)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:320px;overflow:auto;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--mut);line-height:1.6}
.mut{color:var(--mut);font-size:13px}.hide{display:none}
.actions{margin-top:14px;display:flex;gap:8px}
.tip{display:block;text-align:left;color:var(--mut);font-size:12px;margin:6px 0 12px 2px}
.cmdblock{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px;background:var(--card2)}
.cmdblock h2{font-size:13.5px}
/* lista de bots */
.botitem{display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.botitem:hover{background:var(--card2)}
.botitem.sel{background:var(--card2);border-color:var(--acc)}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--acc);flex:0 0 auto;font-size:13px}
.botitem .meta{flex:1;min-width:0}
.botitem .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.botitem .hint{color:var(--mut);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.statuspill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut);flex:0 0 auto}
.statuspill .dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.statuspill.on{color:var(--acc)}.statuspill.on .dot{background:var(--acc)}
/* cabeçalho do bot selecionado */
.botheader{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.nameinput{font-size:19px;font-weight:600;border-color:transparent;background:transparent;padding:5px 8px;flex:1;min-width:160px}
.nameinput:hover,.nameinput:focus{border-color:var(--line);background:var(--card2)}
/* abas verticais */
.panelbody{display:grid;grid-template-columns:172px 1fr;gap:18px}
.tabnav{display:flex;flex-direction:column;gap:2px}
.tabnav button{display:flex;align-items:center;gap:8px;background:transparent;color:var(--mut);border:0;border-left:2px solid transparent;border-radius:0 6px 6px 0;padding:9px 10px;font-size:13.5px;font-weight:500;text-align:left}
.tabnav button:hover{background:var(--card2);color:var(--txt)}
.tabnav button.on{background:var(--card2);color:var(--txt);border-left-color:var(--acc)}
.tabpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
/* log */
.logbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0 10px}
.chip{background:transparent;border:1px solid var(--line);color:var(--mut);padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:500}
.chip:hover{color:var(--txt);background:var(--card2)}
.chip.on{background:var(--card2);color:var(--txt);border-color:var(--acc)}
.chip .n{margin-left:5px;opacity:.65;font-variant-numeric:tabular-nums}
.logbar input{flex:1;min-width:170px;width:auto}
.logbox{background:var(--bg);border:1px solid var(--line);border-radius:9px;max-height:480px;overflow:auto;font-size:12.8px}
.logrow{display:grid;grid-template-columns:64px 112px 1fr;gap:10px;padding:7px 12px;border-bottom:1px solid rgba(35,44,58,.7);align-items:start}
.logrow:last-child{border-bottom:0}
.logrow.erro{background:rgba(229,84,107,.06)}
.logrow .t{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--mut);font-size:12px;padding-top:2px}
.logrow .k{justify-self:start;font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px;white-space:nowrap}
.logrow .m{word-break:break-word;min-width:0}
.logrow .hint{margin-top:4px;color:#E0A84B;font-size:12.3px}
.k.erro{background:rgba(229,84,107,.16);color:var(--bad)}
.k.aviso{background:rgba(224,168,75,.16);color:#E0A84B}
.k.venda{background:rgba(47,191,159,.16);color:var(--acc)}
.k.msg{background:rgba(120,160,255,.14);color:#9DBBFF}
.k.sys{background:var(--card2);color:var(--mut)}
.logempty{padding:28px 16px;text-align:center;color:var(--mut)}
/* produtos */
.prodrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.cmdblock>.row+.prodrow{border-top:0;padding-top:4px}
.thumb{width:64px;height:64px;margin:0;border-radius:9px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--mut);font-size:11px;text-align:center;line-height:1.3}
.thumb:hover{border-color:var(--acc);color:var(--acc)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pfields{display:flex;flex-direction:column;gap:8px;min-width:0}
.pfields .row{margin:0}
.pfields .price{flex:0 0 140px}
.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
/* token e status */
.secret{-webkit-text-security:disc;font-family:ui-monospace,Menlo,Consolas,monospace}
.statusbox{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:12px 0;background:var(--card2);font-size:13px}
.statusbox.ok{border-color:rgba(47,191,159,.45)}.statusbox.warn{border-color:rgba(224,168,75,.5)}
.statusbox b{display:block;margin-bottom:2px}
/* avisos (toast) */
.toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:380px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-left-width:4px;border-radius:9px;padding:11px 15px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--bad)}.toast.warn{border-left-color:#E0A84B}
button:disabled{opacity:.6;cursor:default}
.dirty-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E0A84B;margin-left:6px;vertical-align:middle}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 aside{border-right:0;border-bottom:1px solid var(--line)}
 .panelbody{grid-template-columns:1fr}
 .tabnav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
 .tabnav button{border-left:0;border-bottom:2px solid transparent;border-radius:6px;white-space:nowrap}
 .tabnav button.on{border-bottom-color:var(--acc)}
}
@media(max-width:640px){
 header{padding:10px 14px;flex-wrap:wrap;gap:8px}
 .brand{font-size:14px}
 .content{padding:12px}
 .tabpanel{padding:14px}
 .row{flex-wrap:wrap}
 .row>*{flex:1 1 100%;min-width:0}
 .row>button{flex:0 0 auto}
 input,textarea,select{font-size:16px} /* evita zoom automático no iPhone ao focar */
 .nameinput{font-size:17px;min-width:0;flex:1 1 100%}
 .botheader{gap:8px}
 .cmdblock img,.cmdblock div[style*="width:48px"],.cmdblock div[style*="width:40px"]{width:100%!important;height:120px!important}
 .prodrow{grid-template-columns:56px 1fr auto}
 .thumb{width:56px;height:56px}
 .thumb img{width:100%!important;height:100%!important}
 .pfields .price{flex:1 1 100%}
 .toast{left:12px;right:12px;bottom:12px;max-width:none}
 .logrow{grid-template-columns:auto 1fr;gap:6px 8px}
 .logrow .m{grid-column:1/-1}
}
</style></head><body>
<header>

 <div class="brand"><span class="brand-mark">🤖</span>TeleBot Builder</div>
 <div style="display:flex;gap:8px">
 <button onclick="newBot()">+ Novo bot</button>
 <button class="ghost" onclick="logout()">Sair</button>
 </div>
</header>
<div class="shell">
<aside id="list"></aside>
<div class="content">
 <div class="mut" id="empty">Selecione um bot ao lado ou crie um novo com o token do BotFather.</div>
 <div id="editor" class="hide"></div>
</div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(m,p,b)=>fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const TABS=[['t_cmd','💬','Comandos'],['t_prod','🛍','Produtos e Serviços'],['t_pay','💳','Pagamento'],['t_auto','⚡','Respostas auto'],['t_filter','🚫','Filtros'],['t_perm','🔒','Permissões'],['t_log','📜','Log']];
const ACTION_META={
 '':{label:'Responder com texto',desc:'Envia uma mensagem de texto quando o usuário digitar o comando.'},
 'catalog':{label:'Abrir catálogo',desc:'Mostra automaticamente todos os produtos cadastrados na aba Produtos e Serviços.'},
 'image':{label:'Enviar imagem',desc:'Envia uma foto com legenda quando o usuário digitar o comando.'},
 'link':{label:'Abrir link',desc:'Envia um botão que abre um site ou link externo ao clicar.'},
 'contact':{label:'Pedir contato',desc:'Mostra um botão para o usuário compartilhar o telefone dele com o bot.'},
 'location':{label:'Pedir localização',desc:'Mostra um botão para o usuário compartilhar a localização dele com o bot.'},
 'payment':{label:'Finalizar compra',desc:'Envia o resumo do carrinho (itens + total) e o pagamento: no modo chave Pix manda a chave, o recebedor e o QR Code; no modo automático (API) gera um Pix com o valor exato e confirma sozinho.'}
};
const GATEWAY_META={
 pagbank:{label:'PagBank',hasEnv:true,tokenLabel:'Token da API do PagBank',
  about:'Para vender de verdade o PagBank precisa liberar a API de Pix em produção na sua conta (peça ao suporte).',
  where:'Onde pegar: acesso.pagbank.com.br → Venda online → Integrações → Gerar Token. A conta precisa ter chave Pix cadastrada.'},
 mercadopago:{label:'Mercado Pago',hasEnv:false,tokenLabel:'Access Token do Mercado Pago',
  about:'Libera Pix pela API direto na conta. O modo é definido pelo próprio token: TEST-... é teste, APP_USR-... é venda real.',
  where:'Onde pegar: mercadopago.com.br/developers → Suas integrações → crie uma aplicação → Credenciais de produção (ou de teste) → Access Token. A conta precisa ter chave Pix cadastrada.'},
 asaas:{label:'Asaas',hasEnv:true,tokenLabel:'Chave de API do Asaas',
  about:'Pix pela API com conta de pessoa física ou empresa. Tem ambiente Sandbox separado para testes (conta criada em sandbox.asaas.com).',
  where:'Onde pegar: no Asaas, Menu do usuário → Integrações → Chave de API → Gerar nova chave (começa com $aact_).'}
};
const MODE_META={
 'contains':{label:'contém',desc:'A resposta dispara quando a mensagem do usuário contém essa palavra ou frase em qualquer parte do texto.'},
 'exact':{label:'exata',desc:'A resposta só dispara quando a mensagem do usuário for exatamente igual a essa palavra ou frase.'}
};
const PAY_META={
 '':{label:'Nenhum',desc:'Pagamento desativado — o bot não vai enviar nenhuma opção de pagamento.'},
 'api':{label:'Atendimento automático (API de pagamento)',desc:'Pix automático pelo PagBank, Mercado Pago ou Asaas: o bot pede nome, CPF e e-mail do cliente, gera o QR Code com o valor exato, confirma o pagamento sozinho e avisa você e o cliente.'},
 'pixqr':{label:'Pix com valor exato (sem dados do cliente)',desc:'O bot monta o QR Code Pix com a sua chave e o valor exato do carrinho, sem pedir CPF nem e-mail. Você recebe cada pedido no Telegram e confirma com um toque; o bot avisa o cliente.'},
 'pix':{label:'Atendimento direto (chave Pix)',desc:'O bot envia sua chave Pix e instruções; o cliente paga manualmente e você confirma o recebimento por fora.'}
};
let bots=[],sel=null,tab='t_cmd';
const cur=()=>bots.find(x=>x.id===sel);

async function refresh(){bots=await api('GET','/api/bots');if(sel&&!cur())sel=null;renderList();renderEditor()}
function renderList(){
 if(!bots.length){$('list').innerHTML='<div class="mut">Nenhum bot ainda.</div>';return}
 $('list').innerHTML=bots.map(b=>'<div class="botitem'+(sel===b.id?' sel':'')+'" data-id="'+b.id+'">'
  +'<div class="avatar">'+esc((b.name||'?').trim().charAt(0).toUpperCase())+'</div>'
  +'<div class="meta"><div class="name">'+esc(b.name)+'</div><div class="hint">'+esc(b.token_hint)+'</div></div>'
  +'<span class="statuspill'+(b.enabled?' on':'')+'"><span class="dot"></span></span></div>').join('');
 document.querySelectorAll('.botitem').forEach(el=>el.onclick=()=>{collect();sel=el.dataset.id;renderList();renderEditor()})}
async function logout(){await api('POST','/api/logout');window.location.href='/login'}
async function newBot(){
 const t=prompt('Token do BotFather:');if(!t)return;
 const n=prompt('Nome do bot:','MeuBot')||'MeuBot';
 const j=await api('POST','/api/bots/new',{token:t,name:n});
 if(j.ok){sel=j.id;tab='t_cmd';toast('Bot criado ✓','ok');refresh()}else toast(j.err,'err')}

function rows(list,fields,ph){ // linhas editáveis genéricas (usado por auto_replies)
 return cur()[list].map((r,i)=>{
  const line='<div class="row">'+fields.map(f=>f.t==='area'
   ?'<textarea rows="2" data-l="'+list+'" data-i="'+i+'" data-f="'+f.k+'" placeholder="'+f.p+'">'+esc(r[f.k])+'</textarea>'
   :f.t==='mode'
   ?'<select data-l="'+list+'" data-i="'+i+'" data-f="mode" onchange="collect();renderEditor()"><option value="contains"'+(r.mode!=='exact'?' selected':'')+'>'+MODE_META.contains.label+'</option><option value="exact"'+(r.mode==='exact'?' selected':'')+'>'+MODE_META.exact.label+'</option></select>'
   :'<input data-l="'+list+'" data-i="'+i+'" data-f="'+f.k+'" value="'+esc(r[f.k])+'" placeholder="'+f.p+'">').join('')
   +'<button class="ghost" title="Remover" onclick="rm(\''+list+'\','+i+')">✕</button></div>';
  const hasMode=fields.some(f=>f.t==='mode');
  const tip=hasMode?'<small class="tip">'+MODE_META[r.mode==='exact'?'exact':'contains'].desc+'</small>':'';
  return line+tip;
 }).join('')}
const saveBtn='<div class="actions"><button class="savebtn" onclick="save()">Salvar</button><span class="mut" style="align-self:center">ou Ctrl+S</span></div>';

function cmdRows(b){
 if(!b.commands.length)return '<p class="mut">Nenhum comando ainda.</p>';
 return b.commands.map((c,i)=>{
  const act=c.action||'';
  let extra='';
  if(act===''){
   extra='<textarea rows="2" data-l="commands" data-i="'+i+'" data-f="text" placeholder="resposta">'+esc(c.text)+'</textarea>';
  }else if(act==='image'){
   const thumb=c.image?'<img src="/images/'+esc(c.image)+'" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto">':'';
   extra='<div class="row" style="align-items:center">'+thumb
    +'<input type="file" accept="image/*" onchange="uploadCmdImage(this,'+i+')">'
    +'<textarea rows="1" data-l="commands" data-i="'+i+'" data-f="text" placeholder="legenda">'+esc(c.text)+'</textarea></div>';
  }else if(act==='link'){
   extra='<div class="row"><input data-l="commands" data-i="'+i+'" data-f="url" value="'+esc(c.url||'')+'" placeholder="https://exemplo.com">'
    +'<input data-l="commands" data-i="'+i+'" data-f="text" value="'+esc(c.text)+'" placeholder="texto do botão"></div>';
  }
  return '<div class="cmdblock">'
   +'<div class="row">'
   +'<input data-l="commands" data-i="'+i+'" data-f="cmd" value="'+esc(c.cmd)+'" placeholder="nome (sem /)">'
   +'<select data-l="commands" data-i="'+i+'" data-f="action" onchange="collect();renderEditor()">'
   +Object.entries(ACTION_META).map(([v,m])=>'<option value="'+v+'"'+(act===v?' selected':'')+'>'+m.label+'</option>').join('')
   +'</select>'
   +'<button class="ghost" title="Remover" onclick="rm(\'commands\','+i+')">✕</button>'
   +'</div>'
   +'<small class="tip">'+ACTION_META[act].desc+'</small>'
   +extra
   +'</div>'
 }).join('')}

async function uploadCmdImage(input,i){
 if(!input.files||!input.files[0])return;
 if(!collect())return;
 try{
  const fd=new FormData();fd.append('image',input.files[0]);
  const r=await fetch('/api/upload_image',{method:'POST',body:fd});
  const j=await r.json();
  if(!j.ok){toast('Erro ao enviar imagem: '+j.err,'err');return}
  cur().commands[i].image=j.filename;
  setDirty(true);toast('Foto enviada. Clique em Salvar para aplicar.','ok');renderEditor()
 }catch(e){toast('Falha ao enviar imagem (erro '+(e&&e.message||e)+')','err')}}

function catGroups(b){
 const groups=new Map();
 b.products.forEach((p,i)=>{
  const c=(p.category||'').trim()||'Geral';
  if(!groups.has(c))groups.set(c,[]);
  groups.get(c).push(i);
 });
 return groups;
}
function parsePrice(s){ // mesma regra do servidor: 'R$ 1.234,56' -> 1234.56
 s=String(s==null?'':s).replace(/[^\d,.\-]/g,'');if(!s)return 0;
 if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');
 const v=parseFloat(s);return isNaN(v)?0:v}
const fmtPrice=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function priceBlur(el){const v=parsePrice(el.value);if(v>0){el.value=fmtPrice(v);el.classList.remove('invalid')}}
function prodRow(p,i){
 const thumb=p.image?'<img src="/images/'+esc(p.image)+'" alt="">':'📷<br>foto';
 return '<div class="prodrow">'
  +'<label class="thumb" title="Clique para escolher a foto">'+thumb
  +'<input type="file" accept="image/*" hidden onchange="uploadProdImage(this,'+i+')"></label>'
  +'<div class="pfields"><div class="row">'
  +'<input data-l="products" data-i="'+i+'" data-f="name" value="'+esc(p.name)+'" placeholder="Nome do produto" maxlength="64">'
  +'<input class="price" data-l="products" data-i="'+i+'" data-f="price" value="'+esc(p.price)+'" placeholder="R$ 0,00" inputmode="decimal" name="valor_item_'+i+'" onblur="priceBlur(this)">'
  +'</div><textarea rows="2" data-l="products" data-i="'+i+'" data-f="description" placeholder="Descrição (aparece no bot)">'+esc(p.description)+'</textarea></div>'
  +'<button class="ghost" title="Remover produto" onclick="rm(\'products\','+i+')">✕</button></div>'}
function prodCatalogHTML(b){
 const groups=catGroups(b);
 if(!b.products.length)return '<p class="mut">Nenhuma categoria ainda. Clique em "+ Nova categoria" para começar.</p>';
 let html='';
 for(const [cat,idxs] of groups){
  html+='<div class="cmdblock"><div class="row" style="align-items:center">'
   +'<h2 style="margin:0;flex:1">'+esc(cat)+' <span class="mut">('+idxs.length+')</span></h2>'
   +'<button class="ghost" onclick="addProductToCat(\''+esc(cat).replace(/'/g,"\\'")+'\')">+ Produto</button></div>'
   +idxs.map(i=>prodRow(b.products[i],i)).join('')
   +'</div>';
 }
 return html}
function addProductToCat(cat){

function collect(){ // lê os campos da tela para o objeto local; devolve false se JSON inválido
 const b=cur();if(!b||!$('f_name'))return true;
 b.name=$('f_name').value;
 document.querySelectorAll('[data-l]').forEach(e=>{let v=e.value;if(e.dataset.f==='cmd')v=v.replace(/^\//,'').toLowerCase();b[e.dataset.l][e.dataset.i][e.dataset.f]=v});
 b.admin_only=$('admin_only').checked;
 b.whitelist=$('whitelist').value.split(',').map(s=>parseInt(s.trim(),10)).filter(x=>!isNaN(x));
 if($('pay_type')){
  b.payment=b.payment||{};
  b.payment.type=$('pay_type').value;
  if($('pay_pixkey'))b.payment.pix_key=$('pay_pixkey').value;
  if($('pay_pixname'))b.payment.pix_name=$('pay_pixname').value;
  if($('pay_instructions'))b.payment.instructions=$('pay_instructions').value;
  if($('pay_pixcity'))b.payment.pix_city=$('pay_pixcity').value;
  if($('pay_gateway'))b.payment.gateway=$('pay_gateway').value;
  if($('pay_env'))b.payment.api_env=$('pay_env').value;
  if($('pay_token'))b.payment.api_token=$('pay_token').value.trim();
  if($('pay_admin'))b.payment.admin_chat_id=$('pay_admin').value.trim();
 }
 return true}

function validate(b){ // devolve mensagem de erro ou '' ; marca o campo com problema
 for(let i=0;i<b.products.length;i++){
  const p=b.products[i];
  if(!(p.name||'').trim())return['Um produto está sem nome (categoria "'+((p.category||'').trim()||'Geral')+'").',i,'name'];
  const v=parsePrice(p.price);
  if(!(v>0))return['Preço inválido em "'+p.name+'". Use por exemplo 19,90.',i,'price'];
  p.price=fmtPrice(v);
 }
 return null}
async function save(){

  const [msg,i,f]=bad;tab='t_prod';renderEditor();
  const el=document.querySelector('[data-l="products"][data-i="'+i+'"][data-f="'+f+'"]');
  if(el){el.classList.add('invalid');el.focus()}
  toast(msg,'err');return}
 const btns=[...document.querySelectorAll('.savebtn')];btns.forEach(x=>{x.disabled=true;x.textContent='Salvando...'});
 let j;
 try{j=await api('PUT','/api/bots/'+b.id,b)}catch(e){j={ok:false,err:'Sem conexão com o servidor. Suas alterações continuam na tela; tente salvar de novo.'}}
 btns.forEach(x=>x.disabled=false);
 if(!j.ok){toast(j.err||'Erro ao salvar','err');setDirty(true);return} // não recarrega: nada do que foi digitado se perde
 setDirty(false);toast(j.warn||'Alterações salvas ✓',j.warn?'warn':'ok');refresh()}

const LOG_KIND={ERR:['erro','Erro'],WARN:['aviso','Aviso'],SYS:['sys','Sistema'],PAGO:['venda','💰 Pago'],PIX:['venda','Pix gerado'],
 COMPRA:['venda','Compra'],CARRINHO:['venda','Carrinho'],CMD:['msg','Comando'],CATALOGO:['msg','Catálogo'],AUTO:['msg','Resposta auto'],
 TEXT:['msg','Mensagem'],CALLBACK:['msg','Botão'],CONTATO:['msg','Contato'],LOCALIZACAO:['msg','Localização'],FILTRO:['aviso','Filtro']};
const LOG_FILTERS=[['all','Todos'],['erro','Erros'],['venda','Vendas'],['msg','Mensagens'],['sys','Sistema']];
const LOG_HINTS=[ // [padrão, explicação] — a primeira que casar aparece embaixo do erro
 [/whitelist access required/i,'O PagBank ainda não liberou a API de Pix em produção para a sua conta. Peça a "liberação da API Orders com Pix em produção" ao suporte do PagBank. Enquanto isso, use o ambiente Sandbox ou o modo chave Pix.'],
 [/(PagBank|Mercado Pago|Asaas) 40[13]|UNAUTHORIZED|Invalid credential|invalid_access_token/i,'O intermediador recusou o token. Na aba Pagamento, use "Testar token" e confira o Ambiente (Sandbox ou Produção).'],
 [/Mercado Pago 4\d\d.*(Collector user without key|key enabled for QR)/i,'Sua conta do Mercado Pago não tem chave Pix cadastrada. Cadastre uma chave Pix no app do Mercado Pago e tente de novo.'],
 [/Asaas 4\d\d.*(cpfCnpj|invalid_customer)/i,'O Asaas recusou o CPF do cliente. Peça para o cliente conferir o CPF.'],
 [/(PagBank|Mercado Pago|Asaas) 400.*(tax_id|customer|email|payer|identification)/i,'O intermediador recusou os dados do cliente (CPF ou e-mail). Peça para o cliente conferir os dados.'],
 [/(PagBank|Mercado Pago|Asaas) 400/i,'O intermediador recusou a cobrança. Confira se os produtos têm preço maior que zero e se a conta está com Pix liberado.'],
 [/Conflict/i,'Esse mesmo bot está ligado em outro lugar (outro computador ou servidor). Desligue a outra cópia.'],
 [/InvalidToken|Unauthorized|Not Found.*getMe/i,'O Telegram recusou o token do bot. Gere um token novo no @BotFather e crie o bot de novo.'],
 [/bot was blocked/i,'O cliente bloqueou o bot no Telegram.'],
 [/chat not found/i,'O Telegram não encontrou esse chat. Se for o aviso de venda, mande /start para o seu próprio bot uma vez.'],
 [/partially initialized module|circular import/i,'Erro interno ao iniciar. Pause e ative o bot de novo; se repetir, reinicie o serviço no Render.'],
 [/NetworkError|TimedOut|timed out|ConnectError/i,'Falha de conexão. Se acontecer só de vez em quando é normal; se repetir sempre, pause e ative o bot.'],
];
let logLines=[],logFilter='all',logQuery='',logAuto=true,logShown=[];
function parseLog(l){
 const m=l.match(/^\[(\d\d:\d\d:\d\d)\] (\w+): ([\s\S]*)$/);
 if(!m)return{raw:l,t:'',cls:'sys',label:'',msg:l};
 const k=LOG_KIND[m[2]]||['sys',m[2]];
 return{raw:l,t:m[1],cls:k[0],label:k[1],msg:m[3]}}
const logMatch=(e,f)=>f==='all'||e.cls===f||(f==='erro'&&e.cls==='aviso');
function renderLog(){
 const box=$('logbox');if(!box)return;
 const all=logLines.map(parseLog);
 document.querySelectorAll('.chip[data-f]').forEach(c=>{c.querySelector('.n').textContent=all.filter(e=>logMatch(e,c.dataset.f)).length});
 const q=logQuery.trim().toLowerCase();
 const list=all.filter(e=>logMatch(e,logFilter)&&(!q||e.raw.toLowerCase().includes(q)));
 logShown=list.map(e=>e.raw);
 const atBottom=box.dataset.ready!=='1'||box.scrollHeight-box.scrollTop-box.clientHeight<60;
 box.innerHTML=list.length?list.map(e=>{
  const hint=(e.cls==='erro'||e.cls==='aviso')?(LOG_HINTS.find(([r])=>r.test(e.msg))||[])[1]:'';
  return '<div class="logrow '+e.cls+'"><span class="t">'+esc(e.t)+'</span><span class="k '+e.cls+'">'+esc(e.label)+'</span>'
   +'<div class="m">'+esc(e.msg)+(hint?'<div class="hint">💡 '+esc(hint)+'</div>':'')+'</div></div>'}).join('')
  :'<div class="logempty">'+(logLines.length?'Nada encontrado com esse filtro.':'Nada por aqui ainda. Mande /start para o seu bot no Telegram e os eventos aparecem aqui.')+'</div>';
 if(atBottom)box.scrollTop=box.scrollHeight; // só desce sozinho se você não estiver lendo mais acima
 box.dataset.ready='1'}
function setLogFilter(f){logFilter=f;document.querySelectorAll('.chip[data-f]').forEach(c=>c.classList.toggle('on',c.dataset.f===f));renderLog()}
async function loadLog(){
 if(!sel)return;
 try{const l=await api('GET','/api/bots/'+sel+'/log');logLines=Array.isArray(l)?l:[]}catch(e){return}
 renderLog()}
async function copyLog(){
